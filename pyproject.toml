[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selfiesketch"
version = "0.1.0"
description = "Software-first robotic portrait plotter"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]
vision = ["opencv-python>=4.8", "mediapipe>=0.10"]
ui = ["PySide6>=6.6"]
serial = ["pyserial>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
